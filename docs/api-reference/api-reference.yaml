openapi: 3.1.0
info:
  title: Mock API
  version: 1.0.0
  description: >
    A sample API that allows users to work with payment transactions
servers:
  - url: https://api.mocksoftware.com/v1
paths:
  /payments:
    get:
      summary: List all payments
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
    post:
      summary: Create a new payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /payments/{paymentId}:
    get:
      summary: Retrieve a specific payment using the payment ID
      parameters:
      - name: paymentId
        in: path  
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
components:
  schemas:
    Payment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
    CreatePaymentRequest:
      type: object
      required: [amount, currency, recipientId]
      properties:
        amount:
          type: number
        currency:
          type: string
        recipientId:
          type: string
